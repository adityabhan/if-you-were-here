```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>If You Were Here</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =================================
         INTRO
    ================================= -->

    <section
        class="scene intro"
        id="intro"
    >

        <div class="intro-content">

            <h1>
                I wanted to send you something.
            </h1>

            <p>
                But then I realized...
            </p>

            <p>
                some things can't really be sent.
            </p>

            <button id="continue-button">
                look up ↑
            </button>

        </div>

    </section>



    <!-- =================================
         NIGHT SKY
    ================================= -->

    <section
        class="scene night-sky"
        id="night-sky"
    >

        <!-- Background stars -->

        <div
            class="stars"
            id="stars"
        ></div>


        <!-- Moon -->

        <div class="moon"></div>


        <!-- Introduction message -->

        <div
            class="sky-message"
            id="sky-message"
        >

            <p>
                I remember you telling me
            </p>

            <p>
                you like looking at the moon.
            </p>

            <p class="pause">
                So I thought...
            </p>

            <p>
                maybe I could leave you
            </p>

            <p>
                a few stars.
            </p>

        </div>


        <!-- =================================
             MEMORY CARD
        ================================= -->

        <div
            class="memory-card"
            id="memory-card"
        >

            <button
                class="close-card"
                id="close-card"
                aria-label="Close"
            >
                ×
            </button>


            <div class="memory-content">

                <span
                    class="memory-label"
                    id="memory-label"
                >
                    a little memory
                </span>


                <p
                    class="memory-text"
                    id="memory-text"
                ></p>

            </div>

        </div>

    </section>



    <script src="script.js"></script>

</body>

</html>
```
